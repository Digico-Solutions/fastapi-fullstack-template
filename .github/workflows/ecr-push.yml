name: Build and Push to ECR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        required: true
        options:
          - dev
          - staging
          - production
      build_backend:
        description: 'Build backend image'
        type: boolean
        default: true
      build_frontend:
        description: 'Build frontend image'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      aws_region: ${{ steps.mapper.outputs.aws_region }}
      aws_role_arn: ${{ steps.mapper.outputs.aws_role_arn }}
      ecr_repository_backend: ${{ steps.mapper.outputs.ecr_repository_backend }}
      ecr_repository_frontend: ${{ steps.mapper.outputs.ecr_repository_frontend }}
    steps:
      - name: Set environment variables
        id: mapper
        uses: kanga333/variable-mapper@master
        with:
          key: "${{ inputs.environment }}"
          map: |
            {
              "dev": {
                "aws_region": "eu-west-1",
                "aws_role_arn": "${{ secrets.AWS_ROLE_ARN_DEV }}",
                "ecr_repository_backend": "fastapi-backend-dev",
                "ecr_repository_frontend": "fastapi-frontend-dev"
              },
              "staging": {
                "aws_region": "eu-west-1",
                "aws_role_arn": "${{ secrets.AWS_ROLE_ARN_STAGING }}",
                "ecr_repository_backend": "fastapi-backend-staging",
                "ecr_repository_frontend": "fastapi-frontend-staging"
              },
              "production": {
                "aws_region": "eu-west-1",
                "aws_role_arn": "${{ secrets.AWS_ROLE_ARN_PRODUCTION }}",
                "ecr_repository_backend": "fastapi-backend-production",
                "ecr_repository_frontend": "fastapi-frontend-production"
              }
            }

  build-backend:
    needs: set-environment
    if: inputs.build_backend
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.set-environment.outputs.aws_role_arn }}
          aws-region: ${{ needs.set-environment.outputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ needs.set-environment.outputs.ecr_repository_backend }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f backend/Dockerfile backend/
          
          # Push with commit SHA tag and capture digest
          DIGEST=$(docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --quiet)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          
          echo "### Backend Image Pushed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** $DIGEST" >> $GITHUB_STEP_SUMMARY

  build-frontend:
    needs: set-environment
    if: inputs.build_frontend
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.set-environment.outputs.aws_role_arn }}
          aws-region: ${{ needs.set-environment.outputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push frontend image
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ needs.set-environment.outputs.ecr_repository_frontend }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f frontend/Dockerfile frontend/
          
          # Push with commit SHA tag and capture digest
          DIGEST=$(docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --quiet)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          
          echo "### Frontend Image Pushed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** $DIGEST" >> $GITHUB_STEP_SUMMARY
